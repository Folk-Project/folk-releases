name: Telegram — push issue for discussion

on:
  issues:
    types: [labeled]

jobs:
  notify:
    # only when the `discuss` label is added by an authorized maintainer
    if: github.event.label.name == 'discuss' && github.event.sender.login == 'melentev-av'
    runs-on: ubuntu-latest
    steps:
      - name: Send issue to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          # title: plain text, HTML-escaped
          title=$(printf '%s' "$ISSUE_TITLE" | perl -CS -pe 's/&/&amp;/g; s/</&lt;/g; s/>/&gt;/g;')

          # body: strip markdown -> readable text, truncate by chars, then HTML-escape
          body=$(printf '%s' "$ISSUE_BODY" | perl -CS -0777 -ne '
            s/```.*?```//gs;                 # drop fenced code blocks
            s/\\([`*_~#\[\]()\-])/$1/g;       # unescape \` \* \# ...
            s/`([^`]*)`/$1/g;                 # inline code -> text
            s/\*\*([^*]+)\*\*/$1/g;           # **bold** -> text
            s/__([^_]+)__/$1/g;               # __bold__ -> text
            s/^[ \t]*#{1,6}[ \t]*//mg;        # ## headings -> text
            s/\[([^\]]+)\]\([^)]+\)/$1/g;     # [text](url) -> text
            s/\n{3,}/\n\n/g;                  # collapse blank runs
            s/^\s+|\s+$//g;                   # trim
            if (length > 600) { $_ = substr($_, 0, 600) . "\x{2026}"; }
            s/&/&amp;/g; s/</&lt;/g; s/>/&gt;/g;
            print;
          ')

          text=$(printf '💬 <b>#%s · %s</b>\n\n%s\n\n🔗 %s' \
            "$ISSUE_NUM" "$title" "$body" "$ISSUE_URL")

          payload=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$text" \
            '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: false}')

          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$payload"
