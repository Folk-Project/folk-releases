name: Build Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
  push:
    tags:
      - 'ext-v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.88.0"

jobs:
  # ---------------------------------------------------------------------------
  # Linux builds (Docker on ubuntu-latest, ARM via QEMU)
  # ---------------------------------------------------------------------------
  build-linux:
    name: PHP ${{ matrix.php }} — ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            platform: linux-x86_64
            docker_platform: linux/amd64
          - php: "8.3"
            platform: linux-aarch64
            docker_platform: linux/arm64
          - php: "8.4"
            platform: linux-x86_64
            docker_platform: linux/amd64
          - php: "8.4"
            platform: linux-aarch64
            docker_platform: linux/arm64
          - php: "8.5"
            platform: linux-x86_64
            docker_platform: linux/amd64
          - php: "8.5"
            platform: linux-aarch64
            docker_platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.docker_platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#ext-v}" >> $GITHUB_OUTPUT
          fi

      - name: Parse manifest and generate folk.build.toml
        id: manifest
        run: |
          python3 << 'SCRIPT'
          import re, os, subprocess

          def resolve_latest(crate, ver_spec):
              """Resolve '0.2.*' or '0.2' to actual latest version from crates.io."""
              if '*' not in ver_spec and ver_spec.count('.') == 2:
                  return ver_spec  # already exact, e.g. "0.2.0"
              prefix = ver_spec.replace('.*', '').replace('*', '')
              out = subprocess.check_output(
                  ['cargo', 'search', crate, '--limit=1'],
                  text=True
              )
              # cargo search output: 'crate_name = "0.2.3"  # description'
              m = re.search(rf'{re.escape(crate)}\s*=\s*"([^"]+)"', out)
              if m and m.group(1).startswith(prefix):
                  return m.group(1)
              return prefix + '.0'  # fallback

          with open('build-manifest.toml') as f:
              content = f.read()

          # Extract builder version from [builder] section
          m = re.search(r'\[builder\]\s*\nversion\s*=\s*"([^"]+)"', content)
          builder_spec = m.group(1) if m else '0.2.*'
          builder_ver = resolve_latest('folk-builder', builder_spec)
          print(f'Builder: folk-builder@{builder_ver}')

          # Extract plugin versions from [plugins] section
          plugins = re.findall(r'(folk-plugin-[\w-]+)\s*=\s*"([^"]+)"', content)

          # Generate folk.build.toml
          lines = ['[build]', 'output = "folk"', '']
          for name, ver_spec in plugins:
              ver = resolve_latest(name, ver_spec)
              key = name.replace('folk-plugin-', '')
              lines += [
                  '[[plugin]]',
                  f'crate_name = "{name}"',
                  f'version = "{ver}"',
                  f'config_key = "{key}"',
                  '',
              ]
              print(f'Plugin: {name}@{ver}')

          with open('folk.build.toml', 'w') as f:
              f.write('\n'.join(lines))

          print('\n--- folk.build.toml ---')
          print(open('folk.build.toml').read())

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'builder_version={builder_ver}\n')
          SCRIPT

      - name: Build folk.so in Docker
        run: |
          cat > Dockerfile.build << 'DOCKERFILE'
          ARG RUST_TOOLCHAIN=1.88
          FROM rust:${RUST_TOOLCHAIN} AS rust-src

          ARG PHP_VERSION=8.4
          FROM php:${PHP_VERSION}-zts

          COPY --from=rust-src /usr/local/cargo /usr/local/cargo
          COPY --from=rust-src /usr/local/rustup /usr/local/rustup
          ENV PATH="/usr/local/cargo/bin:${PATH}"
          ENV RUSTUP_HOME="/usr/local/rustup"
          ENV CARGO_HOME="/usr/local/cargo"

          RUN apt-get update && apt-get install -y \
              pkg-config libclang-dev clang protobuf-compiler \
              && rm -rf /var/lib/apt/lists/*

          ARG BUILDER_VERSION=0.2.0
          RUN cargo install folk-builder@${BUILDER_VERSION}

          WORKDIR /build
          COPY folk.build.toml .
          RUN folk-builder build --config folk.build.toml --output-dir /build/
          DOCKERFILE

          docker buildx build \
            --platform ${{ matrix.docker_platform }} \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg RUST_TOOLCHAIN=1.88 \
            --build-arg BUILDER_VERSION=${{ steps.manifest.outputs.builder_version }} \
            --cache-from type=gha,scope=${{ matrix.platform }}-php${{ matrix.php }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.platform }}-php${{ matrix.php }} \
            --output type=local,dest=out/ \
            -f Dockerfile.build .

      - name: Package folk.so
        run: |
          SO_FILE=$(find out/ -name "folk.so" -o -name "libfolk.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so not found in output"
            find out/ -type f
            exit 1
          fi

          ASSET_NAME="folk-php${{ matrix.php }}-zts-${{ matrix.platform }}"
          mkdir -p dist
          cp "$SO_FILE" "dist/${ASSET_NAME}.so"
          cd dist && sha256sum "${ASSET_NAME}.so" > "${ASSET_NAME}.so.sha256"
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # macOS builds (GitHub-hosted runner, native build)
  # ---------------------------------------------------------------------------
  build-macos:
    name: PHP ${{ matrix.php }} — darwin-aarch64
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#ext-v}" >> $GITHUB_OUTPUT
          fi

      - name: Install PHP (ZTS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
        env:
          phpts: zts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install build deps
        run: brew install protobuf llvm

      - name: Parse manifest and generate folk.build.toml
        id: manifest
        run: |
          python3 << 'SCRIPT'
          import re, os, subprocess

          def resolve_latest(crate, ver_spec):
              """Resolve '0.2.*' or '0.2' to actual latest version from crates.io."""
              if '*' not in ver_spec and ver_spec.count('.') == 2:
                  return ver_spec
              prefix = ver_spec.replace('.*', '').replace('*', '')
              out = subprocess.check_output(
                  ['cargo', 'search', crate, '--limit=1'],
                  text=True
              )
              m = re.search(rf'{re.escape(crate)}\s*=\s*"([^"]+)"', out)
              if m and m.group(1).startswith(prefix):
                  return m.group(1)
              return prefix + '.0'

          with open('build-manifest.toml') as f:
              content = f.read()

          m = re.search(r'\[builder\]\s*\nversion\s*=\s*"([^"]+)"', content)
          builder_spec = m.group(1) if m else '0.2.*'
          builder_ver = resolve_latest('folk-builder', builder_spec)
          print(f'Builder: folk-builder@{builder_ver}')

          plugins = re.findall(r'(folk-plugin-[\w-]+)\s*=\s*"([^"]+)"', content)

          lines = ['[build]', 'output = "folk"', '']
          for name, ver_spec in plugins:
              ver = resolve_latest(name, ver_spec)
              key = name.replace('folk-plugin-', '')
              lines += [
                  '[[plugin]]',
                  f'crate_name = "{name}"',
                  f'version = "{ver}"',
                  f'config_key = "{key}"',
                  '',
              ]
              print(f'Plugin: {name}@{ver}')

          with open('folk.build.toml', 'w') as f:
              f.write('\n'.join(lines))

          print('\n--- folk.build.toml ---')
          print(open('folk.build.toml').read())

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'builder_version={builder_ver}\n')
          SCRIPT

      - name: Install folk-builder
        run: cargo install folk-builder@${{ steps.manifest.outputs.builder_version }}

      - name: Build folk.so
        run: folk-builder build --config folk.build.toml --output-dir .

      - name: Package folk.dylib
        run: |
          SO_FILE=$(find . -maxdepth 1 -name "*.dylib" -o -name "*.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so/folk.dylib not found"
            ls -la
            exit 1
          fi

          ASSET_NAME="folk-php${{ matrix.php }}-zts-darwin-aarch64"
          mkdir -p dist
          cp "$SO_FILE" "dist/${ASSET_NAME}.dylib"
          cd dist && shasum -a 256 "${ASSET_NAME}.dylib" > "${ASSET_NAME}.dylib.sha256"
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#ext-v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ext-v${{ steps.version.outputs.version }}
          name: Folk Extension v${{ steps.version.outputs.version }}
          files: dist/**/*
          generate_release_notes: false
          body: |
            ## Folk PHP Extension v${{ steps.version.outputs.version }}

            Pre-built `folk.so` with all plugins (http, jobs, grpc, metrics, process).

            ### Linux (`.so`)

            | PHP | Platform | File |
            |-----|----------|------|
            | 8.3 | x86_64 | `folk-php8.3-zts-linux-x86_64.so` |
            | 8.3 | ARM64 | `folk-php8.3-zts-linux-aarch64.so` |
            | 8.4 | x86_64 | `folk-php8.4-zts-linux-x86_64.so` |
            | 8.4 | ARM64 | `folk-php8.4-zts-linux-aarch64.so` |
            | 8.5 | x86_64 | `folk-php8.5-zts-linux-x86_64.so` |
            | 8.5 | ARM64 | `folk-php8.5-zts-linux-aarch64.so` |

            ### macOS Apple Silicon (`.dylib`)

            | PHP | File |
            |-----|------|
            | 8.3 | `folk-php8.3-zts-darwin-aarch64.dylib` |
            | 8.4 | `folk-php8.4-zts-darwin-aarch64.dylib` |
            | 8.5 | `folk-php8.5-zts-darwin-aarch64.dylib` |

            ### Install (Linux)

            ```bash
            curl -L -o folk.so https://github.com/Folk-Project/folk-releases/releases/download/ext-v${{ steps.version.outputs.version }}/folk-php8.4-zts-linux-x86_64.so
            cp folk.so $(php -r "echo ini_get('extension_dir');")/folk.so
            echo "extension=folk.so" > $(php --ini | grep 'Scan' | awk '{print $NF}')/folk.ini
            php -r "echo folk_version();"
            ```

            ### Install (macOS)

            ```bash
            curl -L -o folk.dylib https://github.com/Folk-Project/folk-releases/releases/download/ext-v${{ steps.version.outputs.version }}/folk-php8.4-zts-darwin-aarch64.dylib
            cp folk.dylib $(php -r "echo ini_get('extension_dir');")/folk.dylib
            echo "extension=folk.dylib" > $(php --ini | grep 'Scan' | awk '{print $NF}')/folk.ini
            php -r "echo folk_version();"
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
