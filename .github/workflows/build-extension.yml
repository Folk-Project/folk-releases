name: Build Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
      release_notes:
        description: "Release notes (one-liner, or leave empty to use RELEASE_NOTES.md from repo)"
        required: false
        default: ""
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.88.0"
  BASE_IMAGE: ghcr.io/folk-project/folk-build-base

jobs:
  # ---------------------------------------------------------------------------
  # Resolve version once, share across all jobs
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Linux x86_64 builds
  # ---------------------------------------------------------------------------
  build-linux-x86:
    name: PHP ${{ matrix.php }} — linux-x86_64
    needs: [prepare]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build folk.so
        run: |
          IMAGE="${{ env.BASE_IMAGE }}:php${{ matrix.php }}-amd64"
          docker pull "$IMAGE"
          # folk-builder reads build-manifest.toml directly (>= 0.2.8).
          docker run --rm \
            -v "$PWD/build-manifest.toml:/build/build-manifest.toml:ro" \
            -v "$PWD/out:/out" \
            "$IMAGE" \
            sh -c "folk-builder build --manifest build-manifest.toml --output-dir /out/"

      - name: Package folk.so (PIE format)
        run: |
          SO_FILE=$(find out/ -name "folk.so" -o -name "libfolk.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so not found in output"
            find out/ -type f
            exit 1
          fi

          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-x86_64-linux-glibc-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.so"
          cd dist && zip "${PIE_NAME}.zip" folk.so && rm folk.so
          sha256sum "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Linux aarch64 builds (native ARM runner)
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    name: PHP ${{ matrix.php }} — linux-aarch64
    needs: [prepare]
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build folk.so
        run: |
          IMAGE="${{ env.BASE_IMAGE }}:php${{ matrix.php }}-arm64"
          docker pull "$IMAGE"
          # folk-builder reads build-manifest.toml directly (>= 0.2.8).
          docker run --rm \
            -v "$PWD/build-manifest.toml:/build/build-manifest.toml:ro" \
            -v "$PWD/out:/out" \
            "$IMAGE" \
            sh -c "folk-builder build --manifest build-manifest.toml --output-dir /out/"

      - name: Package folk.so (PIE format)
        run: |
          SO_FILE=$(find out/ -name "folk.so" -o -name "libfolk.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so not found in output"
            find out/ -type f
            exit 1
          fi

          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-arm64-linux-glibc-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.so"
          cd dist && zip "${PIE_NAME}.zip" folk.so && rm folk.so
          sha256sum "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # macOS builds (GitHub-hosted runner, native build)
  # ---------------------------------------------------------------------------
  build-macos:
    name: PHP ${{ matrix.php }} — darwin-aarch64
    needs: [prepare]
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP (ZTS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
        env:
          phpts: zts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install build deps
        # protobuf/llvm for the base build; cmake + openssl/zstd/sasl are needed
        # to compile the managed-broker jobs drivers (rdkafka builds bundled
        # librdkafka from source; sqs/pubsub/nats TLS). Mirrors the apt deps in
        # Dockerfile.base for the Linux builds.
        run: brew install protobuf llvm cmake openssl@3 zstd

      # Bootstrap only: which folk-builder to install. The manifest itself is
      # parsed by folk-builder (--manifest), not here.
      - name: Resolve folk-builder version from manifest
        id: manifest
        run: |
          spec=$(awk -F'"' '/^\[builder\]/{f=1;next} /^\[/{f=0} f&&/version/{print $2;exit}' build-manifest.toml)
          spec="${spec:-0.2.*}"
          # "0.2.*" -> "^0.2" (cargo requires an explicit qualifier for a range);
          # exact "x.y.z" is kept verbatim.
          case "$spec" in
            *\*) req="^${spec%.*}" ;;
            *)   req="$spec" ;;
          esac
          echo "builder_req=${req}" >> "$GITHUB_OUTPUT"
          echo "folk-builder requirement: ${req}"

      - name: Install folk-builder
        run: cargo install folk-builder --version "${{ steps.manifest.outputs.builder_req }}"

      - name: Build folk.so
        run: folk-builder build --manifest build-manifest.toml --output-dir .

      - name: Package folk.dylib (PIE format)
        run: |
          SO_FILE=$(find . -maxdepth 1 -name "*.dylib" -o -name "*.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so/folk.dylib not found"
            ls -la
            exit 1
          fi

          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-arm64-darwin-bsdlibc-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.dylib"
          cd dist && zip "${PIE_NAME}.zip" folk.dylib && rm folk.dylib
          shasum -a 256 "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [prepare, build-linux-x86, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Prepare release body
        id: body
        run: |
          INPUT_NOTES="${{ github.event.inputs.release_notes }}"

          # Priority: 1) workflow input  2) RELEASE_NOTES.md  3) default text
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          elif [ -f RELEASE_NOTES.md ]; then
            NOTES=$(cat RELEASE_NOTES.md)
          else
            NOTES="Pre-built \`folk.so\` with all plugins (http, jobs, grpc, metrics, process)."
          fi

          {
            echo 'body<<RELEASE_EOF'
            echo "## Folk PHP Extension v${VERSION}"
            echo ""
            echo "$NOTES"

            echo ""
            echo "### Install via PIE (recommended)"
            echo ""
            echo '```bash'
            echo "pie install folk-project/ext-folk"
            echo '```'
            echo ""
            echo "### Manual install"
            echo ""
            echo "Download the matching ZIP from assets below, extract, and copy to your PHP extension dir:"
            echo ""
            echo '```bash'
            echo 'cp folk.so $(php -r "echo ini_get('\''extension_dir'\'');")'
            echo 'echo "extension=folk" > $(php --ini | grep '\''Scan'\'' | awk '\''{print $NF}'\'')/folk.ini'
            echo '```'
            echo ""
            echo "### Available binaries"
            echo ""
            echo "| PHP | Platform | File |"
            echo "|-----|----------|------|"
            for php in 8.2 8.3 8.4 8.5; do
              echo "| ${php} | Linux x86_64 | \`php_folk-${VERSION}_php${php}-x86_64-linux-glibc-zts.zip\` |"
              echo "| ${php} | Linux ARM64 | \`php_folk-${VERSION}_php${php}-arm64-linux-glibc-zts.zip\` |"
            done
            for php in 8.2 8.3 8.4 8.5; do
              echo "| ${php} | macOS ARM64 | \`php_folk-${VERSION}_php${php}-arm64-darwin-bsdlibc-zts.zip\` |"
            done
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Folk Extension v${{ env.VERSION }}
          files: dist/**/*
          generate_release_notes: false
          body: ${{ steps.body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Notify Packagist
  # ---------------------------------------------------------------------------
  packagist:
    name: Notify Packagist
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Ping Packagist
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/Folk-Project/folk-releases"}}')
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Packagist API returned HTTP $HTTP_CODE"
            exit 1
          fi
