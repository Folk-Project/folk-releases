name: Build Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.88.0"
  BASE_IMAGE: ghcr.io/folk-project/folk-build-base

jobs:
  # ---------------------------------------------------------------------------
  # Linux builds — uses pre-built base image from GHCR
  # ---------------------------------------------------------------------------
  build-linux:
    name: PHP ${{ matrix.php }} — ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            platform: linux-x86_64
            docker_platform: linux/amd64
            arch: amd64
          - php: "8.2"
            platform: linux-aarch64
            docker_platform: linux/arm64
            arch: arm64
          - php: "8.3"
            platform: linux-x86_64
            docker_platform: linux/amd64
            arch: amd64
          - php: "8.3"
            platform: linux-aarch64
            docker_platform: linux/arm64
            arch: arm64
          - php: "8.4"
            platform: linux-x86_64
            docker_platform: linux/amd64
            arch: amd64
          - php: "8.4"
            platform: linux-aarch64
            docker_platform: linux/arm64
            arch: arm64
          - php: "8.5"
            platform: linux-x86_64
            docker_platform: linux/amd64
            arch: amd64
          - php: "8.5"
            platform: linux-aarch64
            docker_platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Generate folk.build.toml from manifest
        run: |
          python3 << 'SCRIPT'
          import re

          with open('build-manifest.toml') as f:
              content = f.read()

          plugins = re.findall(r'(folk-plugin-[\w-]+)\s*=\s*"([^"]+)"', content)

          lines = ['[build]', 'output = "folk"', '']
          for name, ver_spec in plugins:
              ver = ver_spec.replace('.*', '')
              key = name.replace('folk-plugin-', '')
              lines += [
                  '[[plugin]]',
                  f'crate_name = "{name}"',
                  f'version = "{ver}"',
                  f'config_key = "{key}"',
                  '',
              ]
              print(f'Plugin: {name} = "{ver}"')

          with open('folk.build.toml', 'w') as f:
              f.write('\n'.join(lines))
          SCRIPT

      - name: Build folk.so
        run: |
          IMAGE="${{ env.BASE_IMAGE }}:php${{ matrix.php }}-${{ matrix.arch }}"
          docker pull --platform linux/${{ matrix.arch }} "$IMAGE"
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD/folk.build.toml:/build/folk.build.toml:ro" \
            -v "$PWD/out:/out" \
            "$IMAGE" \
            sh -c "folk-builder build --config folk.build.toml --output-dir /out/"

      - name: Package folk.so (PIE format)
        run: |
          SO_FILE=$(find out/ -name "folk.so" -o -name "libfolk.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so not found in output"
            find out/ -type f
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"

          # Map platform to PIE naming: {arch}-{os}-{libc}
          case "${{ matrix.platform }}" in
            linux-x86_64)  PIE_ARCH="x86_64"; PIE_OS="linux"; PIE_LIBC="glibc" ;;
            linux-aarch64) PIE_ARCH="arm64";  PIE_OS="linux"; PIE_LIBC="glibc" ;;
          esac

          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-${PIE_ARCH}-${PIE_OS}-${PIE_LIBC}-nodebug-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.so"
          cd dist && zip "${PIE_NAME}.zip" folk.so && rm folk.so
          sha256sum "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # macOS builds (GitHub-hosted runner, native build)
  # ---------------------------------------------------------------------------
  build-macos:
    name: PHP ${{ matrix.php }} — darwin-aarch64
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Install PHP (ZTS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
        env:
          phpts: zts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install build deps
        run: brew install protobuf llvm

      - name: Parse manifest and install folk-builder
        id: manifest
        run: |
          python3 << 'SCRIPT'
          import re, os, subprocess

          def resolve_latest(crate, ver_spec):
              if '*' not in ver_spec and ver_spec.count('.') == 2:
                  return ver_spec
              prefix = ver_spec.replace('.*', '').replace('*', '')
              out = subprocess.check_output(
                  ['cargo', 'search', crate, '--limit=1'], text=True
              )
              m = re.search(rf'{re.escape(crate)}\s*=\s*"([^"]+)"', out)
              if m and m.group(1).startswith(prefix):
                  return m.group(1)
              return prefix + '.0'

          with open('build-manifest.toml') as f:
              content = f.read()

          m = re.search(r'\[builder\]\s*\nversion\s*=\s*"([^"]+)"', content)
          builder_spec = m.group(1) if m else '0.2.*'
          builder_ver = resolve_latest('folk-builder', builder_spec)
          print(f'Builder: folk-builder@{builder_ver}')

          plugins = re.findall(r'(folk-plugin-[\w-]+)\s*=\s*"([^"]+)"', content)

          lines = ['[build]', 'output = "folk"', '']
          for name, ver_spec in plugins:
              ver = resolve_latest(name, ver_spec)
              key = name.replace('folk-plugin-', '')
              lines += [
                  '[[plugin]]',
                  f'crate_name = "{name}"',
                  f'version = "{ver}"',
                  f'config_key = "{key}"',
                  '',
              ]
              print(f'Plugin: {name}@{ver}')

          with open('folk.build.toml', 'w') as f:
              f.write('\n'.join(lines))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'builder_version={builder_ver}\n')
          SCRIPT

      - name: Install folk-builder
        run: cargo install folk-builder@${{ steps.manifest.outputs.builder_version }}

      - name: Build folk.so
        run: folk-builder build --config folk.build.toml --output-dir .

      - name: Package folk.dylib (PIE format)
        run: |
          SO_FILE=$(find . -maxdepth 1 -name "*.dylib" -o -name "*.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so/folk.dylib not found"
            ls -la
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-arm64-darwin-bsdlibc-nodebug-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.dylib"
          cd dist && zip "${PIE_NAME}.zip" folk.dylib && rm folk.dylib
          shasum -a 256 "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Folk Extension v${{ steps.version.outputs.version }}
          files: dist/**/*
          generate_release_notes: false
          body: |
            ## Folk PHP Extension v${{ steps.version.outputs.version }}

            Pre-built `folk.so` with all plugins (http, jobs, grpc, metrics, process).

            ### Install via PIE (recommended)

            ```bash
            pie install folk-project/ext-folk
            ```

            ### Manual install

            Download the matching ZIP from assets below, extract, and copy to your PHP extension dir:

            ```bash
            cp folk.so $(php -r "echo ini_get('extension_dir');")/
            echo "extension=folk" > $(php --ini | grep 'Scan' | awk '{print $NF}')/folk.ini
            ```

            ### Available binaries

            | PHP | Platform | File |
            |-----|----------|------|
            | 8.2 | Linux x86_64 | `php_folk-${{ steps.version.outputs.version }}_php8.2-x86_64-linux-glibc-nodebug-zts.zip` |
            | 8.2 | Linux ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.2-arm64-linux-glibc-nodebug-zts.zip` |
            | 8.3 | Linux x86_64 | `php_folk-${{ steps.version.outputs.version }}_php8.3-x86_64-linux-glibc-nodebug-zts.zip` |
            | 8.3 | Linux ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.3-arm64-linux-glibc-nodebug-zts.zip` |
            | 8.4 | Linux x86_64 | `php_folk-${{ steps.version.outputs.version }}_php8.4-x86_64-linux-glibc-nodebug-zts.zip` |
            | 8.4 | Linux ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.4-arm64-linux-glibc-nodebug-zts.zip` |
            | 8.5 | Linux x86_64 | `php_folk-${{ steps.version.outputs.version }}_php8.5-x86_64-linux-glibc-nodebug-zts.zip` |
            | 8.5 | Linux ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.5-arm64-linux-glibc-nodebug-zts.zip` |
            | 8.2 | macOS ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.2-arm64-darwin-bsdlibc-nodebug-zts.zip` |
            | 8.3 | macOS ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.3-arm64-darwin-bsdlibc-nodebug-zts.zip` |
            | 8.4 | macOS ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.4-arm64-darwin-bsdlibc-nodebug-zts.zip` |
            | 8.5 | macOS ARM64 | `php_folk-${{ steps.version.outputs.version }}_php8.5-arm64-darwin-bsdlibc-nodebug-zts.zip` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ---------------------------------------------------------------------------
  # Notify Packagist
  # ---------------------------------------------------------------------------
  packagist:
    name: Notify Packagist
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Ping Packagist
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/Folk-Project/folk-releases"}}')
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Packagist API returned HTTP $HTTP_CODE"
            exit 1
          fi
