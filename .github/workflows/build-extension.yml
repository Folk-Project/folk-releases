name: Build Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0)"
        required: true
      release_notes:
        description: "Release notes (one-liner, or leave empty to use RELEASE_NOTES.md from repo)"
        required: false
        default: ""
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.88.0"
  BASE_IMAGE: ghcr.io/folk-project/folk-build-base

jobs:
  # ---------------------------------------------------------------------------
  # Resolve version once, share across all jobs
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Linux x86_64 builds
  # ---------------------------------------------------------------------------
  build-linux-x86:
    name: PHP ${{ matrix.php }} — linux-x86_64
    needs: [prepare]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate folk.build.toml from manifest
        run: |
          python3 << 'SCRIPT'
          import re

          with open('build-manifest.toml') as f:
              content = f.read()

          plugins = re.findall(r'(folk-plugin-[\w-]+)\s*=\s*"([^"]+)"', content)

          lines = ['[build]', 'output = "folk"', '']
          for name, ver_spec in plugins:
              ver = ver_spec.replace('.*', '')
              key = name.replace('folk-plugin-', '')
              lines += [
                  '[[plugin]]',
                  f'crate_name = "{name}"',
                  f'version = "{ver}"',
                  f'config_key = "{key}"',
                  '',
              ]
              print(f'Plugin: {name} = "{ver}"')

          with open('folk.build.toml', 'w') as f:
              f.write('\n'.join(lines))
          SCRIPT

      - name: Build folk.so
        run: |
          IMAGE="${{ env.BASE_IMAGE }}:php${{ matrix.php }}-amd64"
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD/folk.build.toml:/build/folk.build.toml:ro" \
            -v "$PWD/out:/out" \
            "$IMAGE" \
            sh -c "folk-builder build --config folk.build.toml --output-dir /out/"

      - name: Package folk.so (PIE format)
        run: |
          SO_FILE=$(find out/ -name "folk.so" -o -name "libfolk.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so not found in output"
            find out/ -type f
            exit 1
          fi

          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-x86_64-linux-glibc-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.so"
          cd dist && zip "${PIE_NAME}.zip" folk.so && rm folk.so
          sha256sum "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Linux aarch64 builds (native ARM runner)
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    name: PHP ${{ matrix.php }} — linux-aarch64
    needs: [prepare]
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Generate folk.build.toml from manifest
        run: |
          python3 << 'SCRIPT'
          import re

          with open('build-manifest.toml') as f:
              content = f.read()

          plugins = re.findall(r'(folk-plugin-[\w-]+)\s*=\s*"([^"]+)"', content)

          lines = ['[build]', 'output = "folk"', '']
          for name, ver_spec in plugins:
              ver = ver_spec.replace('.*', '')
              key = name.replace('folk-plugin-', '')
              lines += [
                  '[[plugin]]',
                  f'crate_name = "{name}"',
                  f'version = "{ver}"',
                  f'config_key = "{key}"',
                  '',
              ]
              print(f'Plugin: {name} = "{ver}"')

          with open('folk.build.toml', 'w') as f:
              f.write('\n'.join(lines))
          SCRIPT

      - name: Build folk.so
        run: |
          IMAGE="${{ env.BASE_IMAGE }}:php${{ matrix.php }}-arm64"
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD/folk.build.toml:/build/folk.build.toml:ro" \
            -v "$PWD/out:/out" \
            "$IMAGE" \
            sh -c "folk-builder build --config folk.build.toml --output-dir /out/"

      - name: Package folk.so (PIE format)
        run: |
          SO_FILE=$(find out/ -name "folk.so" -o -name "libfolk.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so not found in output"
            find out/ -type f
            exit 1
          fi

          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-arm64-linux-glibc-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.so"
          cd dist && zip "${PIE_NAME}.zip" folk.so && rm folk.so
          sha256sum "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # macOS builds (GitHub-hosted runner, native build)
  # ---------------------------------------------------------------------------
  build-macos:
    name: PHP ${{ matrix.php }} — darwin-aarch64
    needs: [prepare]
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP (ZTS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
        env:
          phpts: zts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install build deps
        run: brew install protobuf llvm

      - name: Parse manifest and install folk-builder
        id: manifest
        run: |
          python3 << 'SCRIPT'
          import re, os, subprocess

          def resolve_latest(crate, ver_spec):
              if '*' not in ver_spec and ver_spec.count('.') == 2:
                  return ver_spec
              prefix = ver_spec.replace('.*', '').replace('*', '')
              out = subprocess.check_output(
                  ['cargo', 'search', crate, '--limit=1'], text=True
              )
              m = re.search(rf'{re.escape(crate)}\s*=\s*"([^"]+)"', out)
              if m and m.group(1).startswith(prefix):
                  return m.group(1)
              return prefix + '.0'

          with open('build-manifest.toml') as f:
              content = f.read()

          m = re.search(r'\[builder\]\s*\nversion\s*=\s*"([^"]+)"', content)
          builder_spec = m.group(1) if m else '0.2.*'
          builder_ver = resolve_latest('folk-builder', builder_spec)
          print(f'Builder: folk-builder@{builder_ver}')

          plugins = re.findall(r'(folk-plugin-[\w-]+)\s*=\s*"([^"]+)"', content)

          lines = ['[build]', 'output = "folk"', '']
          for name, ver_spec in plugins:
              ver = resolve_latest(name, ver_spec)
              key = name.replace('folk-plugin-', '')
              lines += [
                  '[[plugin]]',
                  f'crate_name = "{name}"',
                  f'version = "{ver}"',
                  f'config_key = "{key}"',
                  '',
              ]
              print(f'Plugin: {name}@{ver}')

          with open('folk.build.toml', 'w') as f:
              f.write('\n'.join(lines))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'builder_version={builder_ver}\n')
          SCRIPT

      - name: Install folk-builder
        run: cargo install folk-builder@${{ steps.manifest.outputs.builder_version }}

      - name: Build folk.so
        run: folk-builder build --config folk.build.toml --output-dir .

      - name: Package folk.dylib (PIE format)
        run: |
          SO_FILE=$(find . -maxdepth 1 -name "*.dylib" -o -name "*.so" | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "ERROR: folk.so/folk.dylib not found"
            ls -la
            exit 1
          fi

          PIE_NAME="php_folk-${VERSION}_php${{ matrix.php }}-arm64-darwin-bsdlibc-zts"

          mkdir -p dist
          cp "$SO_FILE" "dist/folk.dylib"
          cd dist && zip "${PIE_NAME}.zip" folk.dylib && rm folk.dylib
          shasum -a 256 "${PIE_NAME}.zip" > "${PIE_NAME}.zip.sha256"
          echo "ASSET_NAME=${PIE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [prepare, build-linux-x86, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare release body
        id: body
        run: |
          INPUT_NOTES="${{ github.event.inputs.release_notes }}"

          # Priority: 1) workflow input  2) RELEASE_NOTES.md  3) default text
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          elif [ -f RELEASE_NOTES.md ]; then
            NOTES=$(cat RELEASE_NOTES.md)
          else
            NOTES="Pre-built \`folk.so\` with all plugins (http, jobs, grpc, metrics, process)."
          fi

          {
            echo 'body<<RELEASE_EOF'
            echo "## Folk PHP Extension v${VERSION}"
            echo ""
            echo "$NOTES"

            echo ""
            echo "### Install via PIE (recommended)"
            echo ""
            echo '```bash'
            echo "pie install folk-project/ext-folk"
            echo '```'
            echo ""
            echo "### Manual install"
            echo ""
            echo "Download the matching ZIP from assets below, extract, and copy to your PHP extension dir:"
            echo ""
            echo '```bash'
            echo 'cp folk.so $(php -r "echo ini_get('\''extension_dir'\'');")'
            echo 'echo "extension=folk" > $(php --ini | grep '\''Scan'\'' | awk '\''{print $NF}'\'')/folk.ini'
            echo '```'
            echo ""
            echo "### Available binaries"
            echo ""
            echo "| PHP | Platform | File |"
            echo "|-----|----------|------|"
            for php in 8.2 8.3 8.4 8.5; do
              echo "| ${php} | Linux x86_64 | \`php_folk-${VERSION}_php${php}-x86_64-linux-glibc-zts.zip\` |"
              echo "| ${php} | Linux ARM64 | \`php_folk-${VERSION}_php${php}-arm64-linux-glibc-zts.zip\` |"
            done
            for php in 8.2 8.3 8.4 8.5; do
              echo "| ${php} | macOS ARM64 | \`php_folk-${VERSION}_php${php}-arm64-darwin-bsdlibc-zts.zip\` |"
            done
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Folk Extension v${{ env.VERSION }}
          files: dist/**/*
          generate_release_notes: false
          body: ${{ steps.body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Notify Packagist
  # ---------------------------------------------------------------------------
  packagist:
    name: Notify Packagist
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Ping Packagist
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/Folk-Project/folk-releases"}}')
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Packagist API returned HTTP $HTTP_CODE"
            exit 1
          fi
