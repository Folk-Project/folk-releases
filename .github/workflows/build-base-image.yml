name: Build Base Images

on:
  workflow_dispatch:
    inputs:
      builder_version:
        description: 'folk-builder version (e.g. 0.2.0)'
        required: true
        default: '0.2.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: PHP ${{ matrix.php }} — ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            docker_platform: linux/amd64
          - php: "8.2"
            docker_platform: linux/arm64
          - php: "8.3"
            docker_platform: linux/amd64
          - php: "8.3"
            docker_platform: linux/arm64
          - php: "8.4"
            docker_platform: linux/amd64
          - php: "8.4"
            docker_platform: linux/arm64
          - php: "8.5"
            docker_platform: linux/amd64
          - php: "8.5"
            docker_platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.docker_platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine arch tag
        id: arch
        run: |
          if [ "${{ matrix.docker_platform }}" = "linux/amd64" ]; then
            echo "tag=amd64" >> $GITHUB_OUTPUT
          else
            echo "tag=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: ${{ matrix.docker_platform }}
          push: true
          tags: ghcr.io/folk-project/folk-build-base:php${{ matrix.php }}-${{ steps.arch.outputs.tag }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            BUILDER_VERSION=${{ inputs.builder_version }}
          cache-from: type=gha,scope=base-php${{ matrix.php }}-${{ steps.arch.outputs.tag }}
          cache-to: type=gha,mode=max,scope=base-php${{ matrix.php }}-${{ steps.arch.outputs.tag }}
