name: Build Base Images

on:
  workflow_dispatch:
    inputs:
      builder_version:
        description: 'folk-builder version (e.g. 0.2.9)'
        required: true
        default: '0.2.9'

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    name: PHP ${{ matrix.php }} — amd64
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ghcr.io/folk-project/folk-build-base:php${{ matrix.php }}-amd64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            BUILDER_VERSION=${{ inputs.builder_version }}
          cache-from: type=gha,scope=base-php${{ matrix.php }}-amd64
          cache-to: type=gha,mode=max,scope=base-php${{ matrix.php }}-amd64

  build-arm64:
    name: PHP ${{ matrix.php }} — arm64
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/arm64
          push: true
          tags: ghcr.io/folk-project/folk-build-base:php${{ matrix.php }}-arm64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            BUILDER_VERSION=${{ inputs.builder_version }}
          cache-from: type=gha,scope=base-php${{ matrix.php }}-arm64
          cache-to: type=gha,mode=max,scope=base-php${{ matrix.php }}-arm64
