name: Telegram — announce release

on:
  workflow_run:
    workflows: ["Build Extension"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.1.12)"
        required: true

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            release=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.tag }})
          else
            release=$(gh api repos/${{ github.repository }}/releases/latest)
          fi
          echo "name=$(echo "$release" | jq -r '.name')"         >> $GITHUB_OUTPUT
          echo "tag=$(echo "$release"  | jq -r '.tag_name')"     >> $GITHUB_OUTPUT
          echo "url=$(echo "$release"  | jq -r '.html_url')"     >> $GITHUB_OUTPUT
          # body may be multiline — write to file to avoid quoting issues
          echo "$release" | jq -r '.body' > /tmp/rel_body.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send release announcement to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REL_NAME: ${{ steps.release.outputs.name }}
          REL_TAG: ${{ steps.release.outputs.tag }}
          REL_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail

          # title: plain text, HTML-escaped
          title=$(printf '%s' "${REL_NAME:-$REL_TAG}" | perl -CS -pe 's/&/&amp;/g; s/</&lt;/g; s/>/&gt;/g;')

          # body: strip markdown -> readable text, truncate by chars, then HTML-escape
          body=$(cat /tmp/rel_body.txt | perl -CS -0777 -ne '
            s/```.*?```//gs;                 # drop fenced code blocks
            s/\\([`*_~#\[\]()\-])/$1/g;       # unescape \` \* \# ...
            s/`([^`]*)`/$1/g;                 # inline code -> text
            s/\*\*([^*]+)\*\*/$1/g;           # **bold** -> text
            s/__([^_]+)__/$1/g;               # __bold__ -> text
            s/^[ \t]*#{1,6}[ \t]*//mg;        # ## headings -> text
            s/\[([^\]]+)\]\([^)]+\)/$1/g;     # [text](url) -> text
            s/\n{3,}/\n\n/g;                  # collapse blank runs
            s/^\s+|\s+$//g;                   # trim
            if (length > 600) { $_ = substr($_, 0, 600) . "\x{2026}"; }
            s/&/&amp;/g; s/</&lt;/g; s/>/&gt;/g;
            print;
          ')

          text=$(printf '🚀 <b>%s</b>\n\n%s\n\n🔗 %s' \
            "$title" "$body" "$REL_URL")

          payload=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "$text" \
            '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: false}')

          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$payload"
