# Folk Extension Build Manifest
#
# Which versions of folk-builder and the plugins to use when building the
# pre-compiled folk.so. CI reads this file, generates folk.build.toml, and runs
# folk-builder. The .so is built against PHP **NTS** (Dockerfile.base: php:8.x,
# not -zts).
#
# Plugins may be declared in two forms:
#   * string form:  folk-plugin-http = "0.5.*"     (default features)
#   * table form:   [plugins.folk-plugin-jobs]     (with Cargo features)
#                   version  = "0.5.*"
#                   features = ["redis", "embedded"]
#   Table-form entries MUST come after all string-form entries (TOML rule).
#
# Bump [release] on every rebuild. Per-release history is NOT kept here — see
# RELEASE_NOTES.md and folk-spec (phases table) / git log.

[release]
version = "0.2.11"

[builder]
version = "0.2.19"

[plugins]
folk-plugin-http = "0.5.*"
folk-plugin-grpc = "0.7.*"
folk-plugin-metrics = "0.3.*"
folk-plugin-process = "0.3.*"

[plugins.folk-plugin-jobs]
version = "0.7.*"
# All drivers compiled into the prebuilt .so. Managed-broker drivers pull heavy
# native deps (rdkafka/openssl/sasl) — Dockerfile.base installs them.
features = ["redis", "embedded", "rabbitmq", "sqs", "nats", "beanstalk", "kafka", "pubsub"]
