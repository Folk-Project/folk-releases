# Folk Extension Build Manifest
#
# Defines which versions of folk-builder and plugins to use
# when building pre-compiled folk.so binaries.
#
# CI reads this file, generates folk.build.toml, and runs folk-builder.
#
# Plugins may be declared in two forms:
#   * string form:  folk-plugin-http = "0.4.*"          (default features)
#   * table form:   [plugins.folk-plugin-jobs]          (with Cargo features)
#                   version  = "0.4.*"
#                   features = ["redis", "embedded"]
# Table-form entries MUST come after all string-form entries (TOML rule).

# Phase 79 (fork-after-warm, folk-api 0.3 breaking major): the .so is built
# against PHP **NTS** (Dockerfile.base: php:8.x, not -zts). Every plugin bumps a
# major because it depends on the new folk-api 0.3 plugin contract. Exact patch
# versions are finalized at publish; these are the breaking-major targets.
#
# Phase 80 (#82): folk-plugin-http 0.5.1 adds `[http] public_dir` static-file
# serving. Picked up by the existing "0.5.*" constraint — the .so just needs a
# rebuild (this release bump).
#
# Phase 81 (#80): lazy plugin loading — folk-builder 0.2.12 generates conditional
# plugin registration (a plugin loads only when its folk.toml section is present).
# Plugin crate versions unchanged; the .so must be rebuilt with builder 0.2.12.
#
# folk-builder 0.2.13: the generated extension crate is now stamped with the
# [release] version below, so phpversion("folk") reports it (was always 0.1.0).
#
# Phase 82 (#84 + #85.2): worker process-group isolation (setpgid + killpg),
# pcntl_fork safeguard, destroy_timeout escalation — folk-core/folk-ext 0.4.1.
#
# Phase 83 (#85 remainder): supervisor resilience — per-worker folk_worker_*
# metrics, [workers] liveness_timeout heartbeat recycle, max_jobs/ttl honoured in
# the fork model + staggered recycle — folk-core/folk-ext 0.5.0. No plugin crate
# changed; the .so needs a rebuild against folk-ext 0.5.0. folk-ext 0.5 is a
# minor bump, so folk-builder 0.2.14 bumps its codegen pin "0.4"→"0.5" (^0.4
# would exclude 0.5.0) — [builder] below is 0.2.14 for this reason.
#
# Phase 84 (#86): auth/session leak + multi Set-Cookie. folk-plugin-http 0.5.2
# emits repeated headers; folk-api 0.3.1 / folk-ext 0.5.1 carry response headers
# as ordered pairs (streamed path); folk-builder 0.2.15 regenerates folk_write_head
# accordingly. Plugin constraint "0.5.*" already covers 0.5.2 — the .so must be
# rebuilt with builder 0.2.15 (which pulls folk-ext 0.5.1 / folk-api 0.3.1).
#
# Phase 85 (#81): per-plugin worker pools + cross-pool jobs. `[http].workers` /
# `[jobs].workers` scale subsystems independently (folk-core/folk-ext 0.6.0,
# folk-api 0.3.2 additive — PoolContext + runs_in_every_pool). folk-plugin-jobs
# 0.7.0 is booted in every pool for jobs.push and consumes only in its owning
# pool (cross-pool jobs need redis/a broker). folk-builder 0.2.16 emits the
# per-plugin workers map and pins codegen folk-ext "0.5"→"0.6" (^0.5 excludes
# 0.6.0). http/grpc/metrics/process unchanged; the .so must be rebuilt with
# builder 0.2.16 (which pulls folk-ext 0.6.0 / folk-api 0.3.2).
#
# Phase 87 (#87): gRPC proto DX — proto↔native transcoding + DTO generation.
# folk-plugin-grpc 0.4.0 adds `[grpc] transcode` and the descriptor-export path;
# folk-builder 0.2.17 conditionally codegens the `folk_grpc_descriptors` php
# function when the grpc plugin is in the build. The .so must be rebuilt with
# builder 0.2.17 and grpc "0.4.*". folk-api/folk-ext unchanged.
[release]
version = "0.2.8"

[builder]
version = "0.2.17"

[plugins]
folk-plugin-http = "0.5.*"
folk-plugin-grpc = "0.4.*"
folk-plugin-metrics = "0.3.*"
folk-plugin-process = "0.3.*"

[plugins.folk-plugin-jobs]
version = "0.7.*"
# All drivers compiled into the prebuilt .so. Managed-broker drivers pull heavy
# native deps (rdkafka/openssl/sasl) — Dockerfile.base installs them.
features = ["redis", "embedded", "rabbitmq", "sqs", "nats", "beanstalk", "kafka", "pubsub"]
