# =============================================================================
# Folk Application Server — Configuration Reference
# =============================================================================
#
# Place this file as folk.toml in your project root.
# All values shown below are defaults unless noted otherwise.
#
# Environment variable overrides: FOLK_{SECTION}_{FIELD}
# Example: FOLK_WORKERS_COUNT=8, FOLK_HTTP_LISTEN=0.0.0.0:9000

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
[server]

# Maximum time to wait for graceful shutdown after SIGTERM.
shutdown_timeout = "30s"

# -----------------------------------------------------------------------------
# Workers
# -----------------------------------------------------------------------------
[workers]

# Path to the PHP worker script.
script = "vendor/bin/folk-worker"

# PHP binary path.
php = "php"

# Number of worker PROCESSES the master forks (PHP is NTS — no ZTS needed).
count = 4

# Recycle a worker after this many requests (0 = no limit).
max_jobs = 1000

# Recycle a worker that has been alive longer than this.
ttl = "3600s"

# Per-request HARD deadline: a per-worker watchdog kills the worker process if a
# request overruns, and the master respawns it (other workers are unaffected).
exec_timeout = "30s"

# Recycle a worker whose resident memory (RSS) exceeds this many MB. Omit to
# disable. The master samples per-worker RSS and gracefully recycles offenders.
max_memory_mb = 256

# Maximum time to wait for a worker to boot and signal ready.
boot_timeout = "30s"

# Warm up opcache before spawning workers.
# Compiles all Composer classmap files into shared opcache.
# Set to false to disable.
warmup = true

# -----------------------------------------------------------------------------
# Dev mode (hot reload) — development only, disabled by default
# -----------------------------------------------------------------------------
# Watch PHP files on change so edits are picked up without a manual restart.
# On change the master drains its workers and re-execs itself (clean bootstrap +
# fork), so every worker runs the new code. The watcher runs only in the master.
[dev]

# Enable the file watcher + hot reload. Also turns on dev error reporting:
# fatal worker errors expose the exception class + stack trace to the client
# (HTTP 500 body / gRPC INTERNAL message). In production keep this off so the
# client only sees a generic message (the detail is always logged server-side).
watch = false

# Directories watched recursively (relative to the project root).
watch_paths = ["app", "src", "routes", "config"]

# File extensions that trigger a reload.
watch_extensions = ["php"]

# Debounce window: collapse a burst of file events into one reload.
debounce = "300ms"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[log]

# Log level filter. Examples: "info", "warn", "debug", "folk_core=trace".
filter = "info"

# Output format: "text", "json", or "pretty".
format = "text"

# -----------------------------------------------------------------------------
# HTTP Plugin
# -----------------------------------------------------------------------------
[http]

# Listening address (IP:PORT).
listen = "0.0.0.0:8080"

# Maximum time to read the request body.
read_timeout = "10s"

# Maximum time to write the response.
write_timeout = "30s"

# Stream the request body to PHP instead of buffering it into $payload['body'].
# Raw bodies are read via Folk::read / Folk::readAll; multipart/form-data is
# parsed in Rust and read part-by-part via Folk::nextPart. When true,
# max_request_size is not enforced. Opt-in; default false.
# See docs/php-api.md "Request body streaming" / "Multipart form data".
# stream_request_body = false

# -----------------------------------------------------------------------------
# Jobs Plugin
# -----------------------------------------------------------------------------
# Each driver is a connection that nests its own queues. The connection key IS
# the driver name (one instance per driver type). Default-compiled drivers:
# "memory" and "redis". Opt-in at build time via folk.build.toml features:
# "embedded" (redb) and the managed brokers "rabbitmq", "sqs", "nats",
# "beanstalk", "kafka", "pubsub". See reference.md for every broker field;
# broker drivers ack/nack each message (at-least-once on worker crash).

# In-memory driver — the section only declares queues.
[jobs.connections.memory]
  [jobs.connections.memory.queues.default]
  concurrency = 4            # Concurrent workers for this queue
  max_retries = 3            # Retries before DLQ or discard
  retry_delay = "1s"         # Base delay between retries
  retry_backoff = "exponential"  # "exponential", "linear", or "fixed"
  job_timeout = "60s"        # Max execution time ("0s" = unlimited)
  # dead_letter_queue = "failed"  # Queue for failed jobs (omit to discard)
  priority = 10              # Lower = higher priority

# Redis driver. Address jobs as "redis.<queue>" from PHP, or use a bare name
# when it is unique across connections.
# [jobs.connections.redis]
# host = "127.0.0.1"
# port = 6379
# password = ""
# db = 0
# tls = false
# key_prefix = ""
#   [jobs.connections.redis.queues.critical]
#   concurrency = 8
#   max_retries = 5
#   retry_delay = "500ms"
#   dead_letter_queue = "failed"
#   priority = 1

# Embedded (redb) driver — persistent, requires the "embedded" build feature.
# [jobs.connections.embedded]
# path = "var/jobs.redb"
# durability = "eventual"    # or "immediate" (fsync per commit)
#   [jobs.connections.embedded.queues.heavy]
#   concurrency = 2

# Managed brokers (each requires its build feature — see reference.md for all
# fields). Examples:
# [jobs.connections.rabbitmq]   # feature "rabbitmq"
# url = "amqp://guest:guest@127.0.0.1:5672/%2f"
# prefetch = 10
#   [jobs.connections.rabbitmq.queues.emails]
#   concurrency = 8
#
# [jobs.connections.sqs]        # feature "sqs"; standard + *.fifo queues
# region = "us-east-1"
# endpoint = ""                 # http://localstack:4566 for LocalStack
#   [jobs.connections.sqs.queues.default]
#
# [jobs.connections.nats]       # feature "nats" (JetStream)
# url = "nats://127.0.0.1:4222"
#   [jobs.connections.nats.queues.events]
#
# [jobs.connections.beanstalk]  # feature "beanstalk" (tube = queue)
# host = "127.0.0.1"
# port = 11300
#   [jobs.connections.beanstalk.queues.default]
#
# [jobs.connections.kafka]      # feature "kafka" (topic = queue, consumer group)
# brokers = "localhost:9092"
# group_id = "folk"
#   [jobs.connections.kafka.queues.events]
#
# [jobs.connections.pubsub]     # feature "pubsub"
# project_id = "my-project"
# endpoint = ""                 # emulator host:port; empty = real Pub/Sub
#   [jobs.connections.pubsub.queues.events]

# -----------------------------------------------------------------------------
# gRPC Plugin
# -----------------------------------------------------------------------------
[grpc]

# Listening address for the gRPC server.
listen = "0.0.0.0:50051"

# Proto files for gRPC reflection. Imports are resolved automatically.
# When empty, reflection is disabled.
proto = []

# Example with proto files:
# proto = ["proto/greeter.proto", "proto/orders.proto"]

# -----------------------------------------------------------------------------
# Metrics Plugin
# -----------------------------------------------------------------------------
[metrics]

# Listening address for /metrics (Prometheus) and /health endpoints. The scrape
# server runs in the master and renders the shared-memory segment that all
# worker processes write into.
listen = "0.0.0.0:9090"

# Cap on the number of distinct time series in the shared-memory segment. New
# series beyond this are dropped and folk_metrics_series_dropped is incremented.
max_series = 10000

# -----------------------------------------------------------------------------
# Process Plugin
# -----------------------------------------------------------------------------
# Managed background processes. Each process is supervised and can be
# automatically restarted according to its restart policy.

# Example:
# [[process.processes]]
# name = "queue-worker"
# command = "php artisan queue:work --tries=3"
# restart = "on_failure"    # "always", "on_failure", or "never"
# max_restarts = 5
# restart_delay = "2s"
