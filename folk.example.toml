# =============================================================================
# Folk Application Server — Configuration Reference
# =============================================================================
#
# Place this file as folk.toml in your project root.
# All values shown below are defaults unless noted otherwise.
#
# Environment variable overrides: FOLK_{SECTION}_{FIELD}
# Example: FOLK_WORKERS_COUNT=8, FOLK_HTTP_LISTEN=0.0.0.0:9000

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
[server]

# Path to admin RPC Unix socket.
rpc_socket = "/tmp/folk.sock"

# Maximum time to wait for graceful shutdown after SIGTERM.
shutdown_timeout = "30s"

# -----------------------------------------------------------------------------
# Workers
# -----------------------------------------------------------------------------
[workers]

# Path to the PHP worker script.
script = "vendor/bin/folk-worker"

# PHP binary path.
php = "php"

# Number of worker threads. Values > 1 require PHP ZTS build.
count = 4

# Max concurrent requests per worker. Only 1 is currently supported (sync
# frameworks); values > 1 are reserved for a future async runtime (PHP Fibers)
# and are clamped to 1 with a warning.
max_concurrent_per_worker = 1

# Recycle a worker after this many requests (0 = no limit).
max_jobs = 1000

# Recycle a worker that has been alive longer than this.
ttl = "3600s"

# Per-request execution timeout. Worker is terminated on timeout.
exec_timeout = "30s"

# Maximum time to wait for a worker to boot and signal ready.
boot_timeout = "30s"

# Warm up opcache before spawning workers.
# Compiles all Composer classmap files into shared opcache.
# Set to false to disable.
warmup = true

# -----------------------------------------------------------------------------
# Dev mode (hot reload) — development only, disabled by default
# -----------------------------------------------------------------------------
# Watch PHP files and recycle workers on change so edits are picked up without
# a manual restart. Requires PHP ZTS with count > 1 (the main PHP thread is not
# recyclable). Keep opcache.validate_timestamps = 1 in dev so OPcache sees edits.
[dev]

# Enable the file watcher + hot reload. Also turns on dev error reporting:
# fatal worker errors expose the exception class + stack trace to the client
# (HTTP 500 body / gRPC INTERNAL message). In production keep this off so the
# client only sees a generic message (the detail is always logged server-side).
watch = false

# Directories watched recursively (relative to the project root).
watch_paths = ["app", "src", "routes", "config"]

# File extensions that trigger a reload.
watch_extensions = ["php"]

# Debounce window: collapse a burst of file events into one reload.
debounce = "300ms"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[log]

# Log level filter. Examples: "info", "warn", "debug", "folk_core=trace".
filter = "info"

# Output format: "text", "json", or "pretty".
format = "text"

# -----------------------------------------------------------------------------
# HTTP Plugin
# -----------------------------------------------------------------------------
[http]

# Listening address (IP:PORT).
listen = "0.0.0.0:8080"

# Maximum time to read the request body.
read_timeout = "10s"

# Maximum time to write the response.
write_timeout = "30s"

# Stream the request body to PHP instead of buffering it into $payload['body'].
# Raw bodies are read via Folk::read / Folk::readAll; multipart/form-data is
# parsed in Rust and read part-by-part via Folk::nextPart. When true,
# max_request_size is not enforced. Opt-in; default false.
# See docs/php-api.md "Request body streaming" / "Multipart form data".
# stream_request_body = false

# -----------------------------------------------------------------------------
# Jobs Plugin
# -----------------------------------------------------------------------------
[jobs]

# Queue driver: "memory" or "redis".
driver = "memory"

# Redis connection (used when driver = "redis").
host = "127.0.0.1"
port = 6379
password = ""
db = 0

# Queue definitions. At least one queue is required.
[[jobs.queues]]
name = "default"
concurrency = 4            # Concurrent workers for this queue
max_retries = 3            # Retries before DLQ or discard
retry_delay = "1s"         # Base delay between retries
retry_backoff = "exponential"  # "exponential", "linear", or "fixed"
job_timeout = "60s"        # Max execution time ("0s" = unlimited)
# dead_letter_queue = "failed"  # Queue for failed jobs (omit to discard)
priority = 10              # Lower = higher priority

# Example: high-priority queue with DLQ.
# [[jobs.queues]]
# name = "critical"
# concurrency = 8
# max_retries = 5
# retry_delay = "500ms"
# retry_backoff = "exponential"
# job_timeout = "30s"
# dead_letter_queue = "failed"
# priority = 1

# -----------------------------------------------------------------------------
# gRPC Plugin
# -----------------------------------------------------------------------------
[grpc]

# Listening address for the gRPC server.
listen = "0.0.0.0:50051"

# Proto files for gRPC reflection. Imports are resolved automatically.
# When empty, reflection is disabled.
proto = []

# Example with proto files:
# proto = ["proto/greeter.proto", "proto/orders.proto"]

# -----------------------------------------------------------------------------
# Metrics Plugin
# -----------------------------------------------------------------------------
[metrics]

# Listening address for /metrics (Prometheus) and /health endpoints.
listen = "0.0.0.0:9090"

# -----------------------------------------------------------------------------
# Process Plugin
# -----------------------------------------------------------------------------
# Managed background processes. Each process is supervised and can be
# automatically restarted according to its restart policy.

# Example:
# [[process.processes]]
# name = "queue-worker"
# command = "php artisan queue:work --tries=3"
# restart = "on_failure"    # "always", "on_failure", or "never"
# max_restarts = 5
# restart_delay = "2s"
